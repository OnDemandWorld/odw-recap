[package]
name = "recap-desktop"
version = "0.1.0"
description = "Recap by ODW.ai - sovereign, on-device meeting intelligence"
authors = ["ODW.ai"]
license = ""
repository = "https://github.com/OnDemandWorld/odw-recap"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.4", features = [] }

[dependencies]
tauri = { version = "1.4", features = ["shell-open", "dialog-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Core utilities
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4", "v7", "serde"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Storage & Encryption
rusqlite = { version = "0.30", features = ["bundled", "uuid", "chrono", "serde_json"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"

# Audio input & HTTP server
notify = "6.1"
axum = { version = "0.7", features = ["multipart"] }
reqwest = { version = "0.11", features = ["json", "multipart"] }

# Encoding
base64 = "0.21"
whisper-rs = "0.16.0"
symphonia = { version = "0.5", features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }

[dev-dependencies]
tempfile = "3.8"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
