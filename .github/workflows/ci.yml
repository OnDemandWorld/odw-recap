name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-action@stable
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "desktop-app/src-tauri -> target"
    - name: Run Rust tests
      run: |
        cd desktop-app/src-tauri
        cargo test

  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    - name: Run Go tests
      run: |
        cd team-server
        go test ./...

  build-desktop:
    name: Build Desktop App
    runs-on: ubuntu-latest
    needs: [rust-tests]
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-action@stable
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install dependencies
      run: |
        cd desktop-app
        npm install
    - name: Build Tauri app
      run: |
        cd desktop-app
        npm run tauri build

  build-team-server:
    name: Build Team Server
    runs-on: ubuntu-latest
    needs: [go-tests]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    - name: Build team server
      run: |
        cd team-server
        go build -o recap-team-server ./cmd/server
